# Shared base for every spec in this repository (pnpm).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all.

skip_prereleases: true
cascade: true

# Carried over from this repository's flat-layout spec unchanged. The fleet
# rule is `date`; the port is not the place to change publish identity.
build_timestamp: none

verify:
  github_asset_digest: true

concurrency:
  # Assets are ~40 MB .tar.gz / .zip archives around a ~140 MB Node SEA binary
  # plus its `dist/` tree, so each bundle re-compresses far more than a
  # single-binary CLI mirror. Carried over unchanged.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. The scan only looks BELOW an
# interface PATH entry of the form ${installPath}/<dir>. pnpm's archive has no
# wrapper directory — `pnpm` and its sibling `dist/` sit at the archive ROOT —
# so `strip_components: 0` makes the content root the interface root and PATH a
# bare ${installPath}. Measured, not assumed:
#
#   $ ocx-mirror package validate pnpm/mirror.yml     # with bin_scan: verify
#   ERROR invalid mirror spec:
#     - bin_scan: bin_scan is enabled but metadata.json declares no
#       interface-visible ${installPath}/<dir> PATH entry — the verification
#       would inspect no file and pass green whatever the archive contains.
#   EXIT=65
#
# `off` with a hand-listed `binaries` in pnpm/metadata.json is the blessed
# shape. Pointing PATH at a subdirectory to satisfy the gate is NOT available
# here: the launcher resolves `dist/` relative to itself, so the two must stay
# siblings on the same directory PATH names.
bin_scan: off

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. Upstream ships a SEPARATE glibc and musl build
# per Linux arch and NEITHER is static, so neither covers the other and every
# Linux key carries an explicit libc feature. Evidence above pnpm/mirror.yml's
# `assets:`. Three of the four possible Linux keys are declared; the fourth,
# `linux/arm64+libc.musl`, is withheld — see the block where it would sit.
#
# ⚠️ THE LIBC KEY IS NECESSARY BUT NOT SUFFICIENT HERE. pnpm is a Node
# single-executable-application with a C++ runtime, so it needs shared objects
# no base image ships and `os.features` has no vocabulary to express. Each is
# named in that container's `setup:` below, which narrows the leg's claim
# honestly — not "runs on stock image X", but "runs on stock image X plus these
# named packages". Nothing here is a fat image chosen to make a red go away.
#
# NEEDED sets, measured on the PREPARED BUNDLE (`readelf -d content/pnpm`) and
# identical at v11.1.0 (this spec's floor), v11.9.0 and v11.18.0 — the split is
# stable across the whole published range, so no leg needs a version window:
#
#   glibc x64+arm64  libatomic.so.1 libdl libm libstdc++.so.6 libgcc_s libpthread libc
#   musl  x64        libstdc++.so.6 libgcc_s.so.1 libc.musl-x86_64.so.1
#   musl  arm64      libgcc_s.so.1 libc.so         ← libstdc++ is STATIC here
#
# Only the gap gets installed. ubuntu:24.04 and fedora:40 already carry
# libstdc++/libgcc, so libatomic is their whole gap; alpine:3.20 carries
# neither, and the arm64 musl build needs only libgcc because upstream links
# its libstdc++ statically. Each `setup:` is the measured minimum, not a
# superset — `apk add libstdc++` would also green arm64 (it pulls libgcc), and
# it would overstate what the artifact requires.
#
# The keys themselves are RIGHT, and the cross-checks prove it — each build
# fails at exec under the other's loader, so neither could carry a bare key:
#
#   docker run alpine:3.20  <gnu>/pnpm  → sh: not found   (no ld-linux)
#   docker run ubuntu:24.04 <musl>/pnpm → sh: not found   (no ld-musl)
#
# Legs follow from what each key CLAIMS: `+libc.glibc` → ubuntu + fedora, NO
# alpine (a glibc build cannot load under musl, so an alpine leg would red on a
# correct artifact, and the renderer rejects the mirrored pairing at exit 65).
# `+libc.musl` → alpine only.
platforms:
  "linux/amd64+libc.glibc":
    runner: ubuntu-latest
    # Both glibc arches take the same images and the same setup — anchored so
    # the pair cannot drift apart. Stock, verbatim:
    #   /pkg/pnpm: error while loading shared libraries: libatomic.so.1:
    #     cannot open shared object file: No such file or directory
    # Same message on ubuntu:24.04 and fedora:40, amd64 and arm64. After the
    # setup below, `pnpm --version` prints 11.18.0 on all four.
    containers: &glibc_containers
      - image: "ubuntu:24.04"
        shell: bash
        # Stock ubuntu ships no package lists, so `update` is not optional.
        setup:
          - apt-get update
          - apt-get install -y libatomic1
      - image: "fedora:40"
        shell: bash
        setup:
          - dnf install -y libatomic
  "linux/amd64+libc.musl":
    runner: ubuntu-latest
    containers:
      # Stock alpine, verbatim (C++ runtime symbols — libstdc++):
      #   Error relocating /pkg/pnpm: _ZSt4cout: symbol not found
      #   Error relocating /pkg/pnpm: _ZSt4cerr: symbol not found
      #   Error relocating /pkg/pnpm: _ZNSt5ctypeIcE2idE: symbol not found
      # `apk add libstdc++` pulls libgcc as a dependency, covering both NEEDED
      # entries in one line. → 11.18.0.
      # 11.28.8 adds a libatomic NEEDED entry, same as the glibc build:
      #   Error loading shared library libatomic.so.1: No such file or directory
      - image: "alpine:3.20"
        shell: sh
        setup:
          - apk add --no-cache libstdc++ libatomic
  "linux/arm64+libc.glibc":
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers: *glibc_containers
  # ─── NO `linux/arm64+libc.musl` — WITHHELD, upstream artifact is broken ────
  #
  # Upstream ships `pnpm-linux-arm64-musl.tar.gz`, and it does not run. Its
  # loader gap IS closable — the build static-links libstdc++ and needs only
  # libgcc, and `apk add libgcc` resolves all 31 symbols musl reports missing
  # (verified 31/31 against `nm -D --defined-only /usr/lib/libgcc_s.so.1`) —
  # but the binary then dies before printing a byte:
  #
  #   docker run alpine:3.20 sh -c 'apk add libgcc; pnpm --version'
  #     → Segmentation fault, rc=139, stderr EMPTY
  #
  # Not a library gap and not a mirror defect. Measured 2026-08-02 on v11.18.0:
  #
  #   apk add libgcc     → 139   apk add libstdc++ → 139   (superset, no change)
  #   alpine:3.20 → 139  alpine:3.21 → 139  alpine:3.22 → 139
  #   native ubuntu-24.04-arm runner in CI → 139, empty stderr (run 30754917384)
  #   sha256(bundle content/pnpm) == sha256(upstream tarball pnpm)  ← identical
  #
  # The amd64 musl build of the same release is green, so this is specific to
  # the arm64 musl artifact. No `setup:` can fix a crash inside the artifact,
  # and reaching for a fatter image would only hide it: a user on stock Alpine
  # arm64 hits exactly this. The key is withheld rather than tested loosely —
  # which also drops `pnpm-linux-arm64-musl.tar.gz` from the mirrored set. Add
  # the key back when upstream's arm64 musl build starts.
  darwin/arm64:
    runner: macos-15
    shell: bash
  # No `darwin/amd64`: upstream dropped `pnpm-darwin-x64.tar.gz` at v11.0.5,
  # below this spec's 11.1.0 floor. There is no Intel macOS asset to mirror.
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
    runner: windows-11-arm
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
